<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="유튜브 카워드 스튜디오와 영화·편집 포트폴리오">
<title>MS Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 영상 썸네일·프로필 사진 서버에 미리 연결 (썸네일이 빨리 뜨게) -->
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://yt3.googleusercontent.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<!-- 디자인: 공통 / 섹션 / 인트로 / 관리자 -->
<link rel="stylesheet" href="css/base.css?v=1112h">
<link rel="stylesheet" href="css/sections.css?v=1112h">
<link rel="stylesheet" href="css/intro.css?v=1112h">
<link rel="stylesheet" href="css/admin.css?v=1112h">
<script>
/* 첫 화면이 번쩍 보이지 않게, 인트로를 틀 때는 미리 표시해 둠 */
(function(){
  var r=document.documentElement,admin=location.hash==='#admin';
  try{var t=localStorage.getItem('msp-theme');if(t)r.setAttribute('data-theme',t)}catch(e){}
  if(!admin)r.classList.add('intro-on');
  // 윈도우: 무거운 흐림(유리) 효과를 줄여서 스크롤이 덜 끊기게 (css/base.css html.win)
  if(/Windows/i.test(navigator.userAgent))r.classList.add('win');
})();
</script>
</head>
<body>

<div id="bg" aria-hidden="true"></div>

<!-- ── 인트로 (js/intro.js) ── -->
<div id="intro">
  <div class="i-bg"></div>
  <div id="iCuts" aria-hidden="true"></div>
  <div class="i-slogan" id="iSlogan" aria-hidden="true"></div>
</div>

<!-- ── 위쪽 메뉴 ── -->
<header>
  <div class="wrap">
    <a class="logo glass" href="#top"><span class="badge-ms">MS</span><span id="logoText">MS PORTFOLIO</span></a>
    <nav class="glass" aria-label="주요 메뉴" id="nav"></nav>
    <div class="right">
      <a class="pillcta" href="#contact">작업 의뢰 →</a>
      <button class="tg glass" id="tg" type="button" aria-label="화이트/다크 모드 전환"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>
</header>

<!-- ── 본문 (js/render.js가 data.js 내용으로 채움) ── -->
<main id="top">
  <section class="hero" id="hero"></section>
  <div class="wrap" id="sections"></div>
</main>

<footer id="footer"></footer>

<!-- ── 관리자 패널 (js/admin.js) ── -->
<aside id="admin" hidden></aside>

<!-- 내용(data.js)은 매번 새로 받아옴 → 관리자 모드에서 저장한 내용이 옛날 파일에 가려지지 않게 -->
<script>document.write('<script src="js/data.js?t='+Date.now()+'"><\/script>')</script>
<script src="js/render.js?v=1112h"></script>
<script src="js/intro.js?v=1112h"></script>
<script src="js/admin.js?v=1112h"></script>
</body>
</html>
